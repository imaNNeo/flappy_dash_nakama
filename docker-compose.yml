services:
  postgres:
    container_name: postgres
    # Stays on the 12.x major so the existing data directory on the Pi keeps working.
    # Moving to a newer major needs a dump/restore (see README).
    image: postgres:12.22-alpine
    env_file:
      - .env
    volumes:
      - /mnt/ssd/flappy-dash-nakama/pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    # Only reachable from the Pi itself (it used to be open on every interface).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    container_name: nakama
    user: "1000:1000"
    # The official image is multi-arch (amd64 + arm64), so no custom build is needed on the Pi.
    image: heroiclabs/nakama:3.42.0
    env_file:
      - .env
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
          /nakama/nakama migrate up --database.address postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} &&
          exec /nakama/nakama \
            --name nakama1 \
            --data_dir ./data/ \
            --database.address postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} \
            --logger.file /nakama/data/logfile.log \
            --logger.rotation=true \
            --logger.max_size 50 \
            --logger.max_backups 3 \
            --logger.max_age 14 \
            --session.token_expiry_sec 7200 \
            --session.refresh_token_expiry_sec 604800 \
            --session.encryption_key ${NAKAMA_ENCRYPTION_KEY} \
            --session.refresh_encryption_key ${NAKAMA_REFRESH_ENCRYPTION_KEY} \
            --console.username ${NAKAMA_CONSOLE_USERNAME} \
            --console.password ${NAKAMA_CONSOLE_PASSWORD} \
            --console.port 7351 \
            --socket.server_key ${NAKAMA_SERVER_KEY} \
            --socket.port 7350 \
            --runtime.http_key ${NAKAMA_HTTP_KEY} \
            --runtime.js_entrypoint /functions/build/index.js \
            --runtime.env "IS_PRODUCTION=${IS_PRODUCTION}" \
            --runtime.env "BOT_ADMIN_USER_IDS=${BOT_ADMIN_USER_IDS}" \
            --runtime.env "TELEGRAM_BOT_API_KEY=${TELEGRAM_BOT_API_KEY}" \
            --runtime.env "TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}" \
            --runtime.env "APP_BASE_URL=${APP_BASE_URL}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/nakama/data
    expose:
      - "8349"
      - "8350"
      - "8351"
    ports:
      - "8349:7349"
      - "8350:7350"
      - "8351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5